---
- name: Deploy my-app to Kubernetes
  hosts: localhost
  gather_facts: false
  vars:
    image_tag: "latest"
    app_name: "my-app"
    k8s_namespace: "default"
    docker_user: "rahulvishwa"

  tasks:
    - name: Show which image tag is being deployed
      debug:
        msg: "Deploying image: {{ docker_user }}/{{ app_name }}:{{ image_tag }}"

    - name: Update deployment image
      command: >
        kubectl set image deployment/{{ app_name }}
        {{ app_name }}={{ docker_user }}/{{ app_name }}:{{ image_tag }}
        -n {{ k8s_namespace }}
      changed_when: true

    - name: Wait for rollout to finish
      command: >
        kubectl rollout status deployment/{{ app_name }}
        -n {{ k8s_namespace }}
        --timeout=120s
      changed_when: false

    - name: Verify running pods
      command: "kubectl get pods -n {{ k8s_namespace }} -l app={{ app_name }}"
      register: pod_status
      changed_when: false

    - name: Print pod status
      debug:
        msg: "{{ pod_status.stdout_lines }}"
