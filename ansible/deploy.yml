---
- name: Deploy my-app to Kubernetes
  hosts: localhost
  gather_facts: false
  vars:
    image_tag: "latest"
    app_name: "my-app"
    k8s_namespace: "default"
    docker_user: "rahulvishwa"
    kubeconfig_data: ""

  tasks:
    - name: Show which image tag is being deployed
      debug:
        msg: "Deploying image: {{ docker_user }}/{{ app_name }}:{{ image_tag }}"

    - name: Write kubeconfig from base64 variable
      copy:
        content: "{{ kubeconfig_data | b64decode }}"
        dest: "/tmp/kubeconfig_deploy"
        mode: "0600"
      when: kubeconfig_data != ""

    - name: Set kubeconfig path
      set_fact:
        kubeconfig_path: >-
          {{ '/tmp/kubeconfig_deploy' if kubeconfig_data != '' else lookup('env', 'HOME') + '/.kube/config' }}

    - name: Update deployment image
      command: >
        kubectl set image deployment/{{ app_name }}
        {{ app_name }}={{ docker_user }}/{{ app_name }}:{{ image_tag }}
        -n {{ k8s_namespace }}
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: Wait for rollout to finish
      command: >
        kubectl rollout status deployment/{{ app_name }}
        -n {{ k8s_namespace }}
        --timeout=120s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: Verify running pods
      command: "kubectl get pods -n {{ k8s_namespace }} -l app={{ app_name }}"
      register: pod_status
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: Print pod status
      debug:
        msg: "{{ pod_status.stdout_lines }}"

    - name: Cleanup kubeconfig temp file
      file:
        path: /tmp/kubeconfig_deploy
        state: absent
      when: kubeconfig_data != ""
